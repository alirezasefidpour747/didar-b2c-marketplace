name: DIDAR candidate artifact gates
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: didar-candidate-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CI: 'true'
      MERCUR_BACKEND_URL: same-origin
      NEXT_TELEMETRY_DISABLED: '1'
      MERCUR_DISABLE_TELEMETRY: 'true'
      DIDAR_RELEASE_SOURCE: ${{ github.event.pull_request.head.sha }}
      DIDAR_RELEASE_KIND: REVIEW_CANDIDATE
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.3
      - name: Install locked build and browser tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          bun install --frozen-lockfile
          bunx playwright install --with-deps chromium
      - name: Complete existing acceptance including all 32 browser cases and no-demo
        run: node scripts/ci/validate.mjs
      - name: Fresh candidate images and exported archive
        run: node scripts/ci/release.mjs build .local/candidate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: review-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/candidate/
          include-hidden-files: true
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: candidate-build-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/ci-evidence/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
  verify:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      DIDAR_RELEASE_SOURCE: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.3
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: review-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/candidate
      - name: Verification clients only (no host application startup)
        run: |
          bun install --frozen-lockfile
          bunx playwright install --with-deps chromium
      - name: Exact Debian Nginx/njs candidate edge
        run: |
          bash scripts/ci/prepare-compat-context.sh edge "$RUNNER_TEMP/edge-context"
          docker build --platform linux/amd64 --build-arg SOURCE_SHA="$DIDAR_RELEASE_SOURCE" -t didar-qa-edge "$RUNNER_TEMP/edge-context"
          echo "DIDAR_QA_NGINX_IMAGE=$(docker image inspect --format '{{.Id}}' didar-qa-edge)" >> "$GITHUB_ENV"
      - name: Load downloaded archive and execute actual new-topology artifacts
        run: node scripts/ci/verify-topology-images.mjs .local/candidate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: candidate-artifact-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .local/topology-artifact-evidence/
            .local/candidate/release-manifest.json
            .local/candidate/SHA256SUMS
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
  wrapper-exact-debian:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - name: Protected wrapper on isolated Debian Docker26/Compose2.26
        run: node scripts/ci/exact-wrapper.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: exact-wrapper-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/wrapper-exact-evidence/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

name: DIDAR CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: didar-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CI: 'true'
      MERCUR_BACKEND_URL: same-origin
      NEXT_TELEMETRY_DISABLED: '1'
      MERCUR_DISABLE_TELEMETRY: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - name: Install build and browser prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          bun install --frozen-lockfile
          bunx playwright install --with-deps chromium
      - name: Existing lint, types, disposable integration and production builds
        run: node scripts/ci/validate.mjs
      - name: Upload sanitized observed stage results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/ci-evidence/validation.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

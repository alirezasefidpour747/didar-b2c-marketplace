# Existing eligible staging VM only; no cloud infrastructure is provisioned.
services:
  postgres:
    platform: linux/arm64
    cpus: 0.35
    mem_limit: 1g
    restart: unless-stopped
  redis:
    platform: linux/arm64
    cpus: 0.1
    mem_limit: 256m
    restart: unless-stopped
  migrate:
    platform: linux/arm64
    cpus: 1.5
    mem_limit: 4g
  api:
    platform: linux/arm64
    cpus: 1
    mem_limit: 3g
    restart: unless-stopped
  storefront:
    platform: linux/arm64
    cpus: 0.4
    mem_limit: 768m
    restart: unless-stopped

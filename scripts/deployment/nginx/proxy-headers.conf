# Every upstream has a fixed reviewed destination; no caller-selected host or scheme.
proxy_http_version 1.1;
proxy_set_header Host __PUBLIC_HOST__;
proxy_set_header Connection "";
proxy_set_header Upgrade "";
proxy_set_header Forwarded "";
proxy_set_header X-Forwarded-For "";
proxy_set_header X-Real-IP "";
proxy_set_header True-Client-IP "";
proxy_set_header CF-Connecting-IP "";
proxy_set_header CF-Connecting-IPv6 "";
proxy_set_header CF-Pseudo-IPv4 "";
proxy_set_header Fastly-Client-IP "";
proxy_set_header X-Client-IP "";
proxy_set_header X-Cluster-Client-IP "";
proxy_set_header X-Original-Forwarded-For "";
proxy_set_header X-Envoy-External-Address "";
proxy_set_header Client-IP "";
# These values describe THIS TLS edge, never the caller's headers.
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Host __PUBLIC_HOST__;
proxy_set_header X-Forwarded-Port __PUBLIC_PORT__;
proxy_ssl_server_name on;
proxy_ssl_verify on;
proxy_ssl_verify_depth 3;
proxy_ssl_trusted_certificate __UPSTREAM_CA_FILE__;
proxy_connect_timeout 5s;
proxy_read_timeout 150s;
proxy_send_timeout 150s;
proxy_cache off;
proxy_redirect off;

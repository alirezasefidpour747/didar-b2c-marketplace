name: didar-gold
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: didar
      POSTGRES_DB: didar
      POSTGRES_PASSWORD: ${DIDAR_DB_PASSWORD:?Run scripts/configure.mjs first}
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U didar -d didar"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    image: ${DIDAR_API_IMAGE:-didar-gold-api:staging}
    build: &api-build
      context: .
      target: api
      args:
        MERCUR_BACKEND_URL: ${MERCUR_BACKEND_URL:-http://localhost:9000}
        DIDAR_SOURCE_SHA: ${DIDAR_SOURCE_SHA:?Set the exact reviewed source commit for packaging}
    environment: &api-env
      DATABASE_URL: postgres://didar:${DIDAR_DB_PASSWORD}@postgres:5432/didar?sslmode=disable
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?Run scripts/configure.mjs first}
      COOKIE_SECRET: ${COOKIE_SECRET:?Run scripts/configure.mjs first}
      DIDAR_AUTH_NETWORK_KEY: ${DIDAR_AUTH_NETWORK_KEY:?Configure the shared server-only auth ingress key}
      # Next shares this single API's network namespace: actual egress peer is loopback.
      DIDAR_AUTH_PROXY_PEERS: 127.0.0.1
      STORE_CORS: ${STOREFRONT_URL:-https://localhost:3000}
      ADMIN_CORS: ${MERCUR_BACKEND_URL:-http://localhost:9000}
      VENDOR_CORS: ${MERCUR_BACKEND_URL:-http://localhost:9000}
      AUTH_CORS: ${MERCUR_BACKEND_URL:-http://localhost:9000},${STOREFRONT_URL:-https://localhost:3000}
      FILE_BACKEND_URL: ${MERCUR_BACKEND_URL:-http://localhost:9000}/static
      DIDAR_ENVIRONMENT: ${DIDAR_ENVIRONMENT:-staging}
      DIDAR_SEED_DEMO: ${DIDAR_SEED_DEMO:-false}
      DIDAR_PUBLIC_ORIGIN: ${DIDAR_PUBLIC_ORIGIN:-}
      DIDAR_PUBLIC_ORIGIN_VERIFIED: ${DIDAR_PUBLIC_ORIGIN_VERIFIED:-false}
      DIDAR_PAYMENT_MODE: sandbox
      MERCUR_DISABLE_TELEMETRY: "true"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    command:
      [
        sh,
        -c,
        "cd packages/api && NODE_ENV=development bun x --no-install medusa db:migrate && NODE_ENV=development bun x --no-install medusa exec ./src/scripts/didar-seed.ts",
      ]
  api:
    image: ${DIDAR_API_IMAGE:-didar-gold-api:staging}
    build: *api-build
    environment: *api-env
    depends_on:
      migrate: { condition: service_completed_successfully }
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:3000:3000"]
    volumes: [uploads:/app/packages/api/.medusa/server/static]
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://localhost:9000/didar/catalog').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
  storefront:
    image: ${DIDAR_STOREFRONT_IMAGE:-didar-gold-storefront:staging}
    build:
      <<: *api-build
      target: storefront
    environment:
      MEDUSA_BACKEND_URL: http://127.0.0.1:9000
      DIDAR_AUTH_NETWORK_KEY: ${DIDAR_AUTH_NETWORK_KEY:?Configure the shared server-only auth ingress key}
      DIDAR_AUTH_INGRESS_HOST: 0.0.0.0
      DIDAR_AUTH_INGRESS_PORT: "3000"
      DIDAR_PRIVATE_NEXT_PORT: "3001"
      DIDAR_AUTH_INGRESS_TLS_CERT_FILE: /run/didar-tls/cert.pem
      DIDAR_AUTH_INGRESS_TLS_KEY_FILE: /run/didar-tls/key.pem
      DIDAR_AUTH_HEALTH_SERVER_NAME: ${DIDAR_AUTH_TLS_SERVER_NAME:?Set a DNS name covered by the ingress certificate}
      NODE_EXTRA_CA_CERTS: ${DIDAR_AUTH_TLS_CA_PATH:-}
    # Explicit bounded single-host packaging, not a generic multi-host/CDN topology.
    network_mode: service:api
    volumes:
      - type: bind
        source: ${DIDAR_AUTH_TLS_DIR:?Provide a directory with cert.pem and key.pem}
        target: /run/didar-tls
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      api: { condition: service_healthy }
    stop_grace_period: 25s
    healthcheck:
      test: [CMD, node, runtime/health.mjs]
      interval: 15s
      timeout: 10s
      retries: 10
volumes:
  postgres:
  uploads:
